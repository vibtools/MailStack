limit_req_zone $binary_remote_addr zone=vibmail_contact_ip:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vibmail.my www.vibmail.my;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type text/plain;
        access_log off;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        return 301 https://vibmail.my$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vibmail.my;

    ssl_certificate /etc/letsencrypt/live/vibmail.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibmail.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VIBMAILPUBLICTLS:10m;
    ssl_session_tickets off;

    server_tokens off;

    location / {
        return 301 https://vibmail.my$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vibmail.my;

    ssl_certificate /etc/letsencrypt/live/vibmail.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibmail.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VIBMAILPUBLICTLS:10m;
    ssl_session_tickets off;

    root /var/www/vibmail.my/current;
    index index.html;
    error_page 404 /404.html;
    client_max_body_size 64k;
    server_tokens off;

    access_log /var/log/vibmail/public-site-access.log;
    error_log /var/log/vibmail/public-site-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-ZgZlLRcDHMuKu7DOcL0nyRk41+cyltd3lpWeCyZJNe4=' 'sha256-T/kgxwJg3cKvkeXHSqqaksopeQJSSxtyVx+ZRipPCbE='; connect-src 'self'; font-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /api/contact/csrf/ {
        limit_req zone=vibmail_contact_ip burst=10 nodelay;

        proxy_pass http://unix:/run/vibmail-public-contact/contact.sock:/csrf/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location = /api/contact/ {
        limit_req zone=vibmail_contact_ip burst=4 nodelay;

        proxy_pass http://unix:/run/vibmail-public-contact/contact.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }

    location = /api/contact/health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://unix:/run/vibmail-public-contact/contact.sock:/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/ {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
        expires 1h;
    }

    location = /site.webmanifest {
        try_files $uri =404;
        access_log off;
        expires 1h;
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
